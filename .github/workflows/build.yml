name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder (settings.gradle)
        run: |
          f=$(find . -name settings.gradle -not -path '*/.git/*' | head -1)
          if [ -z "$f" ]; then echo "Brak settings.gradle w repo"; exit 1; fi
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        working-directory: ${{ env.PROJ }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EasyRynek
          path: ${{ env.PROJ }}/build/libs/*.jar
