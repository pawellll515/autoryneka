
name: Build EasyRynek

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EasyRynek-1.0.0

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Zbuduj moda
        run: gradle build --no-daemon

      - name: Udostępnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: EasyRynek-1.0.0
          path: |
            EasyRynek-1.0.0/build/libs/*.jar
            !EasyRynek-1.0.0/build/libs/*-sources.jar
          if-no-files-found: error
